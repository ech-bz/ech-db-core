name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install foundationdb client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake perl
          curl -fsSL -o /tmp/fdb-clients.deb https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          sudo dpkg -i /tmp/fdb-clients.deb
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --workspace
      - run: cargo build -p counter-program --release --target wasm32-unknown-unknown
      - run: cargo test --workspace
      - name: start sui node
        run: |
          docker run -d --name sui -p 9100:9100 \
            mysten/sui-tools:testnet \
            sui start --fullnode-rpc-port 9100
          timeout 180 bash -c 'until docker exec sui test -f /root/.sui/sui_config/client.yaml; do sleep 1; done'
          timeout 180 bash -c 'until docker exec sui sui client gas 2>/dev/null | grep -q 0x; do sleep 2; done'
      - name: publish anchor contract
        run: |
          mkdir -p /tmp/echtest
          docker exec sui mkdir -p /workspace
          docker cp contracts/ech-anchor sui:/workspace/ech-anchor
          docker exec sui rm -rf /workspace/ech-anchor/build
          rm -f /tmp/sui-publish.json
          publish=0
          for _ in 1 2 3; do
            if docker exec sui sui client test-publish --build-env localnet --gas-budget 500000000 --json /workspace/ech-anchor > /tmp/sui-publish.json; then
              publish=1
              break
            fi
            cat /tmp/sui-publish.json
            sleep 5
          done
          [[ "$publish" = 1 ]]
          address=$(docker exec sui sui client active-address)
          docker exec sui sui keytool export --key-identity "$address" | grep -o 'suiprivkey1[a-z0-9]*' > /tmp/sui-privkey.txt
          python3 - <<'PY'
          import json, pathlib

          charset = "qpzry9x8gf2tvdw0s3jn54khce6mua7l"
          text = pathlib.Path("/tmp/sui-privkey.txt").read_text().strip()
          values = [charset.index(c) for c in text[text.rfind("1") + 1 :]][:-6]
          accumulator = 0
          bits = 0
          raw = bytearray()
          for value in values:
              accumulator = (accumulator << 5) | value
              bits += 5
              if bits >= 8:
                  bits -= 8
                  raw.append((accumulator >> bits) & 0xFF)
          seed = bytes(raw[1:33])
          pathlib.Path("/tmp/echtest/sui.key").write_text(seed.hex() + "\n")

          changes = json.load(open("/tmp/sui-publish.json"))["objectChanges"]
          package = next(c["packageId"] for c in changes if c["type"] == "published")
          registry = next(c["objectId"] for c in changes if c.get("objectType", "").endswith("::registry::Registry"))
          cap = next(c["objectId"] for c in changes if c.get("objectType", "").endswith("::registry::PublisherCap"))
          lines = [
              "ECH_TEST_SUI_RPC=http://127.0.0.1:9100",
              f"ECH_TEST_SUI_PACKAGE_ID={package}",
              f"ECH_TEST_SUI_REGISTRY_ID={registry}",
              f"ECH_TEST_SUI_PUBLISHER_CAP_ID={cap}",
              "ECH_TEST_SUI_PUBLISHER_KEY=/tmp/echtest/sui.key",
          ]
          with open("/tmp/echtest/sui.env", "w") as env:
              env.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          cat /tmp/echtest/sui.env >> "$GITHUB_ENV"
      - name: start foundationdb
        run: |
          docker run -d --name fdb --network host \
            -e FDB_NETWORKING_MODE=host \
            -e FDB_PORT=4500 \
            --tmpfs /var/fdb/data:size=2g \
            foundationdb/foundationdb:7.3.63
          mkdir -p /tmp/echtest
          timeout 60 bash -c 'until docker exec fdb cat /var/fdb/fdb.cluster > /dev/null 2>&1; do sleep 1; done'
          docker exec fdb cat /var/fdb/fdb.cluster > /tmp/echtest/fdb.cluster
          cat /tmp/echtest/fdb.cluster
          timeout 120 bash -c "until fdbcli -C /tmp/echtest/fdb.cluster --timeout 5 --exec 'configure new single ssd' || fdbcli -C /tmp/echtest/fdb.cluster --timeout 5 --exec 'status minimal'; do sleep 1; done"
          fdbcli -C /tmp/echtest/fdb.cluster --timeout 10 --exec 'status minimal'
          docker logs fdb | tail -5
          sleep 3
      - name: start s3
        run: |
          mkdir -p /tmp/ech-s3-data
          docker run -d --name s3 --network host \
            -v /tmp/ech-s3-data:/data \
            chrislusf/seaweedfs:3.80 server -s3 -dir=/data -s3.port=8333 -master.port=9333 -volume.port=8080 -filer.port=8888
          timeout 60 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8333)" != "000" ]; do sleep 1; done'
          sleep 3
      - name: run service tests
        env:
          ECH_TEST_FDB_CLUSTER_FILE: /tmp/echtest/fdb.cluster
          ECH_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          ECH_TEST_S3_REGION: us-east-1
          ECH_TEST_S3_BUCKET: ech-db
          ECH_TEST_S3_ACCESS_KEY: ech-access
          ECH_TEST_S3_SECRET_KEY: ech-secret
        run: |
          cargo test -p ech-db-integration-tests --test e2e --test grpc -- --ignored --test-threads=1
          cargo test -p ech-db-fault-injection -- --ignored --test-threads=1
      - name: diagnostics
        if: failure()
        run: |
          free -h
          df -h /
          docker ps -a
          docker inspect sui fdb s3 --format '{{.Name}} state={{.State.Status}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' 2>/dev/null || true
          cat /tmp/sui-publish.json 2>/dev/null | head -40 || true
          docker stats --no-stream || true
          docker logs sui 2>&1 | tail -60 || true
          docker logs fdb 2>&1 | tail -10 || true
          docker logs s3 2>&1 | tail -10 || true
          sudo dmesg 2>/dev/null | tail -60 || true
